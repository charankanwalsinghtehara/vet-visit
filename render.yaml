
services:


  - type: web
    name: vet-visit-api
    runtime: python
    plan: free
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: >
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 2

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "false"

      - key: CORS_ALLOWED_ORIGINS
        value: https://vet-visit.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://vet-visit.onrender.com

      - key: TIME_ZONE
        value: Asia/Kolkata

      # OpenAI configuration
      - key: OPENAI_API_KEY
        sync: false

      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Demo configuration
      - key: DEMO_MODE
        value: "true"

      - key: ALLOW_DEMO_SEED
        value: "false"

      - key: DEMO_PASSWORD
        value: VetCareDemo2026!

      # Payment demo mode
      - key: PAYMENTS_DEMO_MODE
        value: "true"

 
  - type: web
    name: vet-visit
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_URL
        value: https://vet-visit-api.onrender.com/api
