services:
  - type: web
    name: vet-visit-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://vet-visit.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://vet-visit.onrender.com
  - type: web
    name: vet-visit
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://vet-visit-api.onrender.com/api
